<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>问数助手 Beta · Bond Centre</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./inventory.css?v=552">
  <script src="./inventory.js?v=552a" defer></script>
</head>
<body>
  <header class="sitebar">
    <a class="brand" href="../" aria-label="返回 Bond Centre">Bond Centre</a>
    <span class="product">问数助手 <span class="beta-label">Beta</span></span>
    <a href="../" class="back"><span aria-hidden="true">←</span> 返回工作区</a>
  </header>
  <main>
    <div class="workhead">
      <nav aria-label="问数助手导航">
        <button type="button" data-tab="ask" aria-current="page">问数</button>
        <button type="button" data-tab="data">数据台账</button>
      </nav>
      <div class="workhead-actions">
        <button class="quiet" type="button" id="refresh">刷新状态</button>
        <button class="primary" type="button" id="open-upload">上传库存表</button>
      </div>
    </div>
    <div class="notice" id="status-error" role="alert" hidden></div>

    <section id="ask-pane" aria-label="问数">
      <div class="workspace-heading">
        <div><h1>库存问数</h1><p class="meta" id="snapshot-context">正在读取库存快照…</p></div>
        <div class="chat-actions">
          <button type="button" id="open-chats">历史对话</button>
          <button type="button" id="reset" disabled>新对话</button>
          <label class="field compact">库存日期<select id="snapshot-picker" disabled><option>待载入</option></select></label>
        </div>
      </div>
      <div class="empty" id="empty" hidden>
        <h2>还没有库存快照</h2><p>点击上方“上传库存表”，选择完整的余额台账后即可提问。</p>
      </div>
      <div id="query-workspace" hidden>
        <div id="history" aria-label="本轮问答"></div>
        <div id="current-answer" aria-live="polite"></div>
        <section class="composer" aria-label="提问">
          <div class="bar-title"><h2 id="compose-heading">向库存提问</h2></div>
          <div class="suggestions" id="suggestions" aria-label="示例问题"></div>
          <form id="ask-form">
            <label class="sr-only" for="question">库存问题</label>
            <textarea id="question" rows="2" maxlength="1000" placeholder="例如：广州分行的库存按发行人分有多少亿元？" required></textarea>
            <div class="composer-actions">
              <label class="effort">思考强度<select id="effort">
                <option value="low">低</option><option value="medium">中</option><option value="high" selected>高</option><option value="xhigh">更高</option>
              </select></label>
              <button type="submit" class="primary" id="submit">提问 <span aria-hidden="true">↑</span></button>
            </div>
          </form>
          <p class="meta" id="ai-status" role="status"></p>
        </section>
        <details class="manual" id="manual">
          <summary>手动查询</summary>
          <form id="manual-form">
            <label class="field">联动分行<input name="branch" placeholder="全部"></label>
            <label class="field">发行人<input name="issuer" placeholder="全部"></label>
            <label class="field">担保人 / ABS 增信方<input name="guarantor" placeholder="机构全称或简称"></label>
            <label class="field">损益还原客户<input name="attribution" placeholder="机构全称或简称"></label>
            <label class="field">持仓范围<select name="scope"><option value="">全部</option><option>表内</option><option>委外</option><option>委外(公募)</option><option>委外(专户)</option></select></label>
            <label class="field">交易组合<input name="portfolio" placeholder="全部"></label>
            <label class="field">会计分类<input name="account" placeholder="全部"></label>
            <label class="field">债券类型<input name="marketType" placeholder="全部"></label>
            <label class="field">债券代码<input name="code" placeholder="含市场后缀"></label>
            <label class="field">存续口径<select name="holdingStatus"><option value="">全部持仓</option><option value="存续">正本金且表列到期日在业务日后</option></select></label>
            <label class="field">分组<select name="group"><option value="issuer">发行人</option><option value="code">逐券</option><option value="branch">联动分行</option><option value="portfolio">交易组合</option><option value="scope">持仓范围</option><option value="account">会计分类</option><option value="marketType">债券类型</option><option value="none">不分组</option></select></label>
            <label class="field">统计指标<select name="metric"><option value="principal">名义本金</option><option value="count">持仓行数</option><option value="securities">不同券数</option></select></label>
            <button class="secondary" type="submit">按条件查询</button>
          </form>
        </details>
      </div>
      <div id="query-notice" class="notice" role="status" hidden></div>
    </section>

    <section id="data-pane" aria-label="数据台账" hidden>
      <div class="workspace-heading"><div><h1>数据台账</h1></div></div>
      <form class="upload" id="upload-form">
        <h2>上传库存表</h2>
        <p class="meta">请上传单一业务日、全库存范围的完整余额台账。同日修订会显示新旧条数和金额，再确认替换。</p>
        <div class="file-actions">
          <label class="file-select"><span>选择 Excel</span><input type="file" id="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" aria-label="选择库存 Excel 工作簿"></label>
          <span id="file-name" class="meta">尚未选择文件</span>
          <button class="primary" type="submit" id="upload" disabled>上传并发布</button>
        </div>
      </form>
      <div id="revision" class="notice" hidden>
        <h3>同日快照已有数据</h3>
        <p id="revision-message"></p>
        <div class="inline-actions"><button type="button" class="primary" id="replace">确认替换</button><button type="button" id="cancel-replace">取消</button></div>
      </div>
      <div id="upload-notice" class="notice" role="status" hidden></div>
      <section class="snapshots"><div class="bar-title"><h2>库存快照</h2><span class="meta" id="snapshot-count"></span></div><div id="snapshot-list"></div></section>
    </section>
  </main>
  <dialog id="chat-dialog" aria-labelledby="chat-list-heading">
    <div class="dialog-head"><h2 id="chat-list-heading">历史对话</h2><button type="button" class="close" id="close-chats" aria-label="关闭历史对话">×</button></div>
    <p class="meta" id="chat-list-status" role="status"></p>
    <div id="chat-list"></div>
    <button type="button" id="more-chats" hidden>加载更早的对话</button>
  </dialog>
  <dialog id="detail" aria-labelledby="detail-title">
    <div class="dialog-head"><div><h2 id="detail-title">持仓明细</h2><p class="meta" id="detail-meta"></p></div><button type="button" class="close" id="close-detail" aria-label="关闭明细">×</button></div>
    <div id="detail-body" aria-live="polite"></div>
    <div class="pager"><button type="button" id="detail-prev">上一页</button><span id="detail-range" class="meta"></span><button type="button" id="detail-next">下一页</button></div>
  </dialog>
</body>
</html>
