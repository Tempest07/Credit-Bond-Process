<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>问数助手 Beta · Bond Centre</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./inventory.css?v=joint1">
  <script type="module" src="./joint.js?v=joint1"></script>
</head>
<body data-workspace="joint">
  <header class="sitebar">
    <a class="brand" href="../" aria-label="返回 Bond Centre">Bond Centre</a>
    <span class="product">问数助手 <span class="beta-label">Beta</span></span>
    <a href="../" class="back"><span aria-hidden="true">←</span> 返回工作区</a>
  </header>
  <main>
    <div class="workhead">
      <nav aria-label="问数助手导航">
        <button type="button" data-tab="ask" aria-current="page">问数</button>
        <button type="button" data-tab="data">数据台账</button>
      </nav>
      <div class="workhead-actions">
        <button class="quiet" type="button" id="refresh">刷新状态</button>
        <button class="primary" type="button" id="open-upload">上传台账</button>
      </div>
    </div>
    <div class="notice" id="status-error" role="alert" hidden></div>

    <section id="ask-pane" aria-label="问数">
      <div class="workspace-heading">
        <div><h1>台账问数</h1><p class="meta" id="snapshot-context">正在读取台账…</p></div>
        <div class="chat-actions">
          <button type="button" id="open-chats">历史对话</button>
          <button type="button" id="reset" disabled>新对话</button>
          <label class="field compact">参考库存日期<select id="snapshot-picker" disabled><option>待载入</option></select></label>
        </div>
      </div>
      <div class="empty" id="empty" hidden>
        <h2>还没有可查询的台账</h2><p>上传余额台账或年度增减持表后即可提问。</p>
      </div>
      <div id="query-workspace" hidden>
        <p id="origin-context" class="meta" hidden></p>
        <div id="history" aria-label="本轮问答"></div>
        <div id="current-answer" aria-live="polite"></div>
        <section class="composer" aria-label="提问">
          <div class="bar-title"><h2 id="compose-heading">向台账提问</h2></div>
          <div class="suggestions" id="suggestions" aria-label="示例问题"></div>
          <form id="ask-form">
            <label class="sr-only" for="question">台账问题</label>
            <textarea id="question" rows="2" maxlength="1000" placeholder="例如：广州分行 10 月末持仓多少，当月净增持多少？" required></textarea>
            <div class="composer-actions">
              <label class="effort">思考强度<select id="effort">
                <option value="low">低</option><option value="medium">中</option><option value="high" selected>高</option><option value="xhigh">更高</option>
              </select></label>
              <button type="submit" class="primary" id="submit">提问 <span aria-hidden="true">↑</span></button>
            </div>
          </form>
          <p class="meta" id="ai-status" role="status"></p>
          <p class="meta manual-entry"><a href="./inventory.html?chat=new#manual">手动查库存</a></p>
        </section>

      </div>
      <div id="query-notice" class="notice" role="status" hidden></div>
    </section>

    <section id="data-pane" aria-label="数据台账" hidden>
      <div class="workspace-heading"><div><h1>数据台账</h1></div></div>
      <form class="upload" id="upload-form" novalidate>
        <h2>上传余额台账</h2>
        <p class="meta">每份文件须为一个业务日的全库存余额台账。可分次添加文件，也可从周报文件夹按年份选取。</p>
        <div class="file-actions">
          <label class="file-select"><span>选择 Excel 文件</span><input type="file" id="file" multiple accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" aria-label="选择库存 Excel 工作簿"></label>
          <div class="folder-select" id="folder-controls">
            <label for="upload-year">文件夹年份</label><input type="number" id="upload-year" min="2000" step="1">
            <label class="file-select"><span>选择周报文件夹</span><input type="file" id="folder" webkitdirectory multiple aria-label="选择周报文件夹"></label>
          </div>
        </div>
        <p class="meta" id="folder-notice" role="status" hidden></p>
        <div class="file-actions queue-actions">
          <span id="file-name" class="meta">尚未选择文件</span>
          <button class="primary" type="submit" id="upload" disabled>上传并发布</button>
          <button type="button" id="clear-upload" hidden>清空列表</button>
        </div>
      </form>
      <div id="upload-notice" class="notice" role="status" hidden></div>
      <ul class="upload-list" id="upload-list" aria-label="本批文件" hidden></ul>
      <form class="upload" id="trade-upload-form">
        <h2>上传增减持台账</h2>
        <p>请选择从年初累计至报表期末的完整 Excel。上传后，同一年度、同一方向以新表为准。</p>
        <div class="file-actions">
          <label class="file-select"><span>选择 Excel 文件</span><input type="file" id="trade-file" multiple accept=".xlsx" aria-label="选择增减持 Excel 工作簿"></label>
          <button class="primary" id="trade-upload" type="submit" disabled>上传并生效</button>
        </div>
      </form>
      <div class="notice" id="trade-upload-notice" role="status" hidden></div>
      <ul class="upload-list" id="trade-upload-list" aria-label="本批增减持台账" hidden></ul>
      <section class="snapshots"><div class="bar-title"><h2>增减持累计表</h2><span class="meta" id="book-count"></span></div><div class="flow-register" id="book-list"></div></section>
      <section class="snapshots"><div class="bar-title"><h2>库存快照</h2><span class="meta" id="snapshot-count"></span></div><div id="snapshot-list"></div></section>
    </section>
  </main>
  <dialog id="chat-dialog" aria-labelledby="chat-list-heading">
    <div class="dialog-head"><h2 id="chat-list-heading">历史对话</h2><button type="button" class="close" id="close-chats" aria-label="关闭历史对话">×</button></div>
    <p class="meta" id="chat-list-status" role="status"></p>
    <div id="chat-list"></div>
    <button type="button" id="more-chats" hidden>加载更早的对话</button>
  </dialog>
  <dialog id="detail" aria-labelledby="detail-title">
    <div class="dialog-head"><div><h2 id="detail-title">持仓明细</h2><p class="meta" id="detail-meta"></p></div><button type="button" class="close" id="close-detail" aria-label="关闭明细">×</button></div>
    <div id="detail-body" aria-live="polite"></div>
    <div class="pager"><button type="button" id="detail-prev">上一页</button><span id="detail-range" class="meta"></span><button type="button" id="detail-next">下一页</button></div>
  </dialog>
</body>
</html>
